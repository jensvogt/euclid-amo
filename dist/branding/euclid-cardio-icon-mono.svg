<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256"
     role="img" aria-label="Euclid">
  <title>Euclid</title>

  <!--
    Single-colour variant of euclid-cardio-icon.svg, for anywhere the mark has to take
    the surrounding text colour: dark mode, a printed sheet, a stencilled tray icon.

    Identical geometry. The arcs keep their 0.32 opacity rather than becoming a lighter
    tint of the ink, so the three weights survive when currentColor is black on white.
  -->

  <g fill="none" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round">
    <!-- construction: arc B->C struck from A, arc A->C struck from B -->
    <g opacity="0.32" stroke-width="7">
      <path d="M 230 216 A 204 204 0 0 0 128 39.33"/>
      <path d="M 26 216 A 204 204 0 0 1 128 39.33"/>
    </g>

    <!-- result: the equilateral triangle -->
    <path d="M 26 216 L 230 216 L 128 39.33 Z" stroke-width="16"/>

    <!-- ECG: baseline, P wave, QRS complex, T wave, baseline. 76..180, centred on 128. -->
    <path d="M 76 170 L 84 170 Q 94 155 104 170 L 114 170 L 120 185
             L 128 104 L 136 191 L 145 170 L 152 170 Q 164 147 176 170 L 180 170"
          stroke-width="11"/>
  </g>
</svg>
